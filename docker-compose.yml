services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tayviscon
      POSTGRES_USER: tayviscon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tayviscon}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tayviscon_pgdata:/var/lib/postgresql/data

volumes:
  tayviscon_pgdata:
